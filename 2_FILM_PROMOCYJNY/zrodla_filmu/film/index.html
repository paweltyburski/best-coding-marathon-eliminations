class Track{constructor(v0){this.v0=v0;this.cur=v0;this.ev=[];}to(t,v,sp=SP.ui){if(v!==this.cur){this.ev.push([t,v-this.cur,sp]);this.cur=v;}return this;}at(t){let v=this.v0;for(const[ti,d,sp]of this.ev)v+=d*stepR(t-ti,sp);return v;}}
