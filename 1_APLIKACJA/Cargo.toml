[package]
name = "ogarniacz"
version = "0.1.0"
edition = "2021"
description = "Ogarniacz: smart planner zadań dla studenta z asystentem Ogar"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
